<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: http://127.0.0.1:* http://localhost:*; media-src 'self' blob: http://127.0.0.1:* http://localhost:*;">
<title>HuminLoop</title>
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="rel-dock.css">
</head><body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <h1 title="HuminLoop — AI-powered knowledge capture">HuminLoop</h1>
    <div class="tab-bar">
      <button type="button" class="tab active" data-tab="general" onclick="switchTab('general')" title="Clips not assigned to any project">General Notes</button>
      <button type="button" class="tab" data-tab="projects" onclick="switchTab('projects')" title="Organize clips by project — open a project to view its workflow">Projects</button>
    </div>
  </div>
  <div class="header-right">
    <button type="button" class="hdr-icon-btn" onclick="openRelChat()" title="Ask Rel — your AI workflow assistant">&#x1F43A;</button>
    <button type="button" class="hdr-icon-btn" onclick="switchTab('help')" title="Help — how to use HuminLoop">?</button>
    <button type="button" class="hdr-icon-btn" onclick="switchTab('settings')" title="Settings — configure capture, AI, and app behavior">&#x2699;</button>
  </div>
</div>
<div id="aiBar" class="ai-bar hidden">
  <span class="spinner">*</span><span id="aiBarMsg">AI categorizing...</span>
</div>
<div id="noKeyBanner" class="no-key-banner hidden">
  No credentials found. Add credentials.json (GCP service account) to the project folder.
</div>
<div id="statusBar" class="status-bar">
  <span id="subtitle">Loading...</span>
</div>

<!-- Main Layout -->
<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar"></div>
  <!-- Main Content -->
  <div class="main" id="mainArea"></div>
</div>

<!-- Rel — embedded AI assistant docked bottom-right (see rel-panel.js) -->
<button type="button" id="relLauncher" class="rel-launcher" title="Ask Rel — your AI workflow assistant" aria-label="Ask Rel">&#x1F43A;</button>
<div id="relDock" class="rel-dock hidden">
  <div class="rel-header">
    <div class="rel-id">
      <span class="rel-avatar">&#x1F43A;</span>
      <div class="rel-names">
        <span class="rel-title">RelliK Krow-Wolf</span>
        <span class="rel-sub">call him &ldquo;Rel&rdquo;</span>
      </div>
    </div>
    <div class="rel-header-right">
      <select id="relProjectSelect" class="rel-project" title="Active project"></select>
      <button type="button" id="relCloseBtn" class="rel-x" title="Close">&#x2715;</button>
    </div>
  </div>

  <div id="relMessages" class="rel-messages"></div>

  <div id="relStatusBar" class="rel-status" style="display:none">
    <span class="rel-status-dot"></span>
    <span id="relStatusText">Rel is thinking&hellip;</span>
    <span id="relToolTicker" class="rel-tools"></span>
  </div>

  <div class="rel-input-row">
    <textarea id="relInput" class="rel-input" rows="2" placeholder="Ask Rel anything about this project&hellip;"></textarea>
    <div class="rel-input-btns">
      <button type="button" id="relStopBtn" class="rel-btn stop" style="display:none" title="Stop">&#x23F9;</button>
      <button type="button" id="relSendBtn" class="rel-btn primary" title="Send">&#x27A4;</button>
    </div>
  </div>
</div>

<script src="index.js"></script>
<script src="rel-panel.js"></script>
</body></html>
